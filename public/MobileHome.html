                                                        <!-- Modal Overlay (Hidden by default) -->

                                                        <!-- Receipt Modal Overlay -->
                                                        <div id="receipt-modal" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                                                                <div class="bg-white w-full rounded-2xl p-6 shadow-xl flex flex-col gap-4">
                                                                        <h3 id="receipt-verdict" class="font-headline-sm text-xl font-bold text-center"></h3>
                                                                        <div class="bg-gray-100 p-3 rounded-lg overflow-x-auto">
                                                                                <p class="font-mono-label text-xs text-gray-600 break-all" id="receipt-details"></p>
                                                                        </div>
                                                                        <button id="receipt-close" class="w-full bg-primary text-white font-semibold py-3 rounded-xl">Done</button>
                                                                </div>
                                                        </div>

                                                        <!-- Hidden file input for QR scanning -->
                                                        <input type="file" id="qr-upload" accept="image/*" capture="environment" class="hidden" />

                                                        <script>
                                                                async function callAgent(type, value) {
                                                                        try {
                                                                                const response = await fetch("https://payder.onrender.com/agent/check", {
                                                                                        method: "POST",
                                                                                        headers: { "Content-Type": "application/json" },
                                                                                        body: JSON.stringify({ type, value })
                                                                                });
                                                                                const data = await response.json();
                                                                                
                                                                                const verdictEl = document.getElementById("receipt-verdict");
                                                                                if (data.verdict === "Safe") {
                                                                                        verdictEl.innerText = "✅ SAFE";
                                                                                        verdictEl.className = "font-headline-sm text-xl font-bold text-center text-green-600";
                                                                                } else {
                                                                                        verdictEl.innerText = "⚠️ FLAGGED (FRAUD)";
                                                                                        verdictEl.className = "font-headline-sm text-xl font-bold text-center text-red-600";
                                                                                }
                                                                                
                                                                                // Show the receipt from the x402 transaction
                                                                                let receiptText = "";
                                                                                let reasonText = "";
                                                                                if (data.receipts && data.receipts.length > 0) {
                                                                                        receiptText = "x402 Cryptographic Receipt:\n\n" + data.receipts.map(r => r.service + ": " + r.receipt).join("\n");
                                                                                        const firstReason = data.receipts.find(r => r.reason)?.reason;
                                                                                        if (firstReason) reasonText = firstReason + "\n\n";
                                                                                } else {
                                                                                        receiptText = "No cryptographic receipt returned.";
                                                                                }
                                                                                
                                                                                document.getElementById("receipt-details").innerText = reasonText + receiptText;
                                                                                document.getElementById("receipt-modal").classList.remove("hidden");
                                                                                
                                                                        } catch (e) {
                                                                                alert("Error: " + e.message);
                                                                        }
                                                                }

                                                                // Modal logic
                                                                const qrModal = document.getElementById("qr-modal");
                                                                let html5QrcodeScanner = null;

                                                                document.getElementById("btn-check-upi").addEventListener("click", () => {
                                                                        qrModal.classList.remove("hidden");
                                                                        document.getElementById("qr-reader").classList.add("hidden");
                                                                });

                                                                document.getElementById("modal-close").addEventListener("click", () => {
                                                                        qrModal.classList.add("hidden");
                                                                        if (html5QrcodeScanner) {
                                                                                html5QrcodeScanner.clear().catch(e => console.error(e));
                                                                                html5QrcodeScanner = null;
                                                                        }
                                                                });

                                                                document.getElementById("modal-type-upi").addEventListener("click", () => {
                                                                        qrModal.classList.add("hidden");
                                                                        const id = prompt("Enter UPI ID:");
                                                                        if (id) callAgent("upi", id);
                                                                });

                                                                document.getElementById("modal-scan-live").addEventListener("click", () => {
                                                                        document.getElementById("qr-reader").classList.remove("hidden");
                                                                        if (!html5QrcodeScanner) {
                                                                                html5QrcodeScanner = new Html5QrcodeScanner(
                                                                                        "qr-reader",
                                                                                        { fps: 10, qrbox: {width: 250, height: 250} },
                                                                                        /* verbose= */ false
                                                                                );
                                                                                html5QrcodeScanner.render((decodedText, decodedResult) => {
                                                                                        // Stop scanning on success
                                                                                        html5QrcodeScanner.clear();
                                                                                        html5QrcodeScanner = null;
                                                                                        qrModal.classList.add("hidden");
                                                                                        
                                                                                        // Send the decoded text as a UPI ID
                                                                                        callAgent("upi", decodedText);
                                                                                }, (error) => {
                                                                                        // parse error, ignore
                                                                                });
                                                                        }
                                                                });

                                                                document.getElementById("modal-scan-qr").addEventListener("click", () => {
                                                                        qrModal.classList.add("hidden");
                                                                        document.getElementById("qr-upload").click();
                                                                });

                                                                document.getElementById("qr-upload").addEventListener("change", (e) => {
                                                                        const file = e.target.files[0];
                                                                        if (file) {
                                                                                const reader = new FileReader();
                                                                                reader.onloadend = () => {
                                                                                        callAgent("qr", reader.result);
                                                                                };
                                                                                reader.readAsDataURL(file);
                                                                        }
                                                                });

                                                                document.getElementById("receipt-close").addEventListener("click", () => {
                                                                        document.getElementById("receipt-modal").classList.add("hidden");
                                                                });

                                                                document.getElementById("btn-check-message").addEventListener("click", () => {
                                                                        const text = prompt("Enter Message:");
                                                                        if (text) callAgent("message", text);
                                                                });
                                                                
                                                                document.getElementById("btn-report").addEventListener("click", async () => {
                                                                        const id = prompt("Enter identifier to report:");
                                                                        if (id) {
                                                                                await fetch("https://payder.onrender.com/report", {
                                                                                        method: "POST",
                                                                                        headers: { "Content-Type": "application/json" },
                                                                                        body: JSON.stringify({ identifier: id, reporter_wallet: "0xuser" })
                                                                                });
                                                                                alert("Reported successfully!");
                                                                        }
                                                                });
                                                        </script>
